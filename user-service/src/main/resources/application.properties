spring.datasource.url=jdbc:postgresql://localhost:5432/test_db
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


server.port=8081

spring.application.name=user-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


resilience4j.circuitbreaker.instances.kafkaCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.kafkaCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.kafkaCB.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.kafkaCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.kafkaCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.kafkaCB.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.kafkaCB.automaticTransitionFromOpenToHalfOpenEnabled=true

management.endpoints.web.exposure.include=health,info,circuitbreakerevents
management.endpoint.health.show-details=always

